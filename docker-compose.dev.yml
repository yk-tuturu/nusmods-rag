# Local dev — builds from source instead of pulling from GHCR.
# Usage: docker compose -f docker-compose.dev.yml up --build

x-backend-image: &backend-image
  build:
    context: ./backend
  env_file:
    - ./backend/.env

services:
  backend:
    <<: *backend-image
    environment:
      ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"

  scraper:
    <<: *backend-image
    entrypoint: ["./refresh.sh"]
    profiles: ["tools"]
    volumes:
      - ./backend/data.new:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

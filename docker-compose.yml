# Production compose file — pulls pre-built images from GHCR rather than
# building on the VM (the VM is small; building sentence-transformers/torch
# and the Next.js frontend on it is slow and memory-hungry compared to doing
# it on a GitHub Actions runner and just pulling the finished image).
#
# For local development, use `docker compose -f docker-compose.dev.yml up`
# instead, which builds from source.

# Anchor holding everything the backend image needs, reused by both the
# always-on API service and the on-demand scraper below so they don't drift.
x-backend-image: &backend-image
  image: ghcr.io/yk-tuturu/nusmod-backend:latest
  env_file:
    - ./backend/.env
  volumes:
    - ./backend/data:/app/data
  networks:
    - internal

services:
  backend:
    <<: *backend-image
    environment:
      ALLOWED_ORIGINS: https://nusadvice.ykkoh.com
    restart: unless-stopped

  # Not part of `docker compose up` — the "tools" profile means this only
  # starts when explicitly asked for, e.g.:
  #   docker compose run --rm scraper
  #   docker compose run --rm scraper --courses CS2030,CS2040
  scraper:
    <<: *backend-image
    entrypoint: ["./refresh.sh"]
    profiles: ["tools"]

  frontend:
    image: ghcr.io/yk-tuturu/nusmod-frontend:latest
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - backend
      - frontend

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:

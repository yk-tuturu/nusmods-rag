x-backend-image: &backend-image
  image: ghcr.io/yk-tuturu/nusmod-backend:latest
  env_file:
    - ./backend/.env
  networks:
    - internal

services:
  backend:
    <<: *backend-image
    environment:
      ALLOWED_ORIGINS: https://nusadvice.ykkoh.com
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    labels:
      caddy: api.ykkoh.com
      caddy.reverse_proxy: "{{upstreams 8000}}"  # the port the backend actually listens on inside the container

  scraper:
    <<: *backend-image
    entrypoint: ["./refresh.sh"]
    profiles: ["tools"]
    volumes:
      - ./backend/data.new:/app/data
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # no caddy labels — this one's never web-facing

  frontend:
    image: ghcr.io/yk-tuturu/nusmod-frontend:latest
    restart: unless-stopped
    networks:
      - internal
    labels:
      caddy: nusadvice.ykkoh.com
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  # Caddy itself lives in a separate, standalone stack (~/reverse-proxy on
  # the VM) shared across multiple apps on the box -- this project only
  # joins its network via labels, it doesn't own or run Caddy.
  internal:
    external: true
    name: caddy_shared_net

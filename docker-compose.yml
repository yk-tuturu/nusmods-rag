x-backend-image: &backend-image
  image: ghcr.io/yk-tuturu/nusmod-backend:latest
  env_file:
    - ./backend/.env
  networks:
    - internal

services:
  backend:
    <<: *backend-image
    environment:
      ALLOWED_ORIGINS: https://nusadvice.ykkoh.com
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    labels:
      caddy: api.ykkoh.com
      caddy.reverse_proxy: "{{upstreams 8000}}"  # the port the backend actually listens on inside the container

  scraper:
    <<: *backend-image
    entrypoint: ["./refresh.sh"]
    profiles: ["tools"]
    volumes:
      - ./backend/data.new:/app/data
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # no caddy labels — this one's never web-facing

  frontend:
    image: ghcr.io/yk-tuturu/nusmod-frontend:latest
    restart: unless-stopped
    networks:
      - internal
    labels:
      caddy: nusadvice.ykkoh.com
      caddy.reverse_proxy: "{{upstreams 3000}}"

  caddy:
    image: lucaslorentz/caddy-docker-proxy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - internal
    environment:
      # Real Docker network name, not the compose-local "internal" alias --
      # caddy-docker-proxy inspects containers via the Docker API directly,
      # which only knows networks by their actual name.
      - CADDY_INGRESS_NETWORKS=caddy_shared_net
    depends_on:
      - backend
      - frontend

networks:
  internal:
    external: true
    name: caddy_shared_net

volumes:
  caddy_data:
  caddy_config:

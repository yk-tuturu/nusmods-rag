name: Scrape (prod)

# Runs the full pipeline (default pilot course list) on GitHub's runner —
# deliberately NOT on the VM, since running scrape+clean+chunk+embed
# alongside the live backend was starving it of CPU/memory. Only the
# finished data/ directory gets shipped to the VM afterward, plus a cheap
# container restart to pick it up.
on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 03:00 UTC, weekly
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull backend image
        run: docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/nusmod-backend:latest

      - name: Run scrape -> clean -> chunk -> embed
        run: |
          mkdir -p data
          docker run --rm \
            -v ${{ github.workspace }}/data:/app/data \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/nusmod-backend:latest \
            ./refresh.sh

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      # Sync into a STAGING directory, never straight into the live,
      # bind-mounted data/ the running backend is reading from. Chroma's
      # persistence is several files (sqlite metadata + separate vector
      # index files) that all have to agree with each other — an rsync
      # straight into the live directory updates them one at a time, and a
      # request landing mid-sync could read a mix of old and new files that
      # don't correspond to each other.
      - name: Sync data to staging directory on VM
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            data/ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/nusmods-rag/backend/data.new/

      # `mv` within the same filesystem is atomic — the backend can only
      # ever see the fully-old or fully-new directory, never a partial mix.
      - name: Atomically swap in new data and restart backend
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} '
            set -e
            cd ~/nusmods-rag/backend
            rm -rf data.old
            mv data data.old
            mv data.new data
            cd ~/nusmods-rag
            docker compose restart backend
            rm -rf backend/data.old
          '

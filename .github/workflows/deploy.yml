name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/nusmod-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ykkoh.com
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/nusmod-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/nusmods-rag
            docker compose pull
            docker compose up -d
            docker image prune -f

      # programme/*.md is baked into the backend image (see backend/Dockerfile),
      # not bind-mounted like data/ - so the container above already has
      # whatever's newest in programme/ once it restarts. This just needs to
      # re-run chunk+embed so Chroma (which IS bind-mounted, at backend/data)
      # actually reflects it - re-pulling the image alone doesn't touch
      # Chroma.
      #
      # Runs unconditionally on every deploy, not gated on whether this push's
      # diff touched backend/programme/** - a diff-based gate was tried and
      # dropped: it compares against the *previous push*, not the *last
      # successfully deployed* commit, so a push that fixes an unrelated
      # failed deploy (without itself touching programme/) would skip this
      # step and leave Chroma stuck on stale programme content indefinitely.
      # Running it every time is self-correcting regardless of what broke a
      # prior deploy.
      #
      # --programme-only and embed.py's skip-unchanged logic were meant to
      # make a no-op run cheap, and they do cut CPU cost - but they don't
      # address the actual OOM cause hit here: `docker compose exec` opens a
      # SECOND, independent Chroma client against the live collection while
      # the backend's own client is still loaded, and Chroma has to load the
      # full vector index (not just the rows being touched) for either
      # client to work at all. At the production collection's size
      # (12,000+ vectors, once real course data is scraped in) two loaded
      # copies of that index is what exceeded the VM's memory - a problem
      # that scales with total collection size, not with how much actually
      # changed, so --programme-only alone couldn't fix it. Stopping the
      # backend first means only one Chroma client is ever loaded at once,
      # at the cost of a few seconds of API downtime during deploy - already
      # true of the plain restart above, just slightly extended here.
      - name: Re-embed programme docs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/nusmods-rag
            docker compose stop backend
            docker compose run --rm backend sh -c "python src/pipeline/chunk.py --programme-only && python src/pipeline/embed.py"
            docker compose up -d backend

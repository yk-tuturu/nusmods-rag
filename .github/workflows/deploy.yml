name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/nusmod-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.ykkoh.com
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/nusmod-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH in and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/nusmods-rag
            docker compose pull
            docker compose up -d
            docker image prune -f

      # programme/*.md is baked into the backend image (see backend/Dockerfile),
      # not bind-mounted like data/ - so the container above already has
      # whatever's newest in programme/ once it restarts. This just needs to
      # re-run chunk+embed so Chroma (which IS bind-mounted, at backend/data)
      # actually reflects it - re-pulling the image alone doesn't touch
      # Chroma.
      #
      # Runs unconditionally on every deploy, not gated on whether this push's
      # diff touched backend/programme/** - a diff-based gate was tried and
      # dropped: it compares against the *previous push*, not the *last
      # successfully deployed* commit, so a push that fixes an unrelated
      # failed deploy (without itself touching programme/) would skip this
      # step and leave Chroma stuck on stale programme content indefinitely.
      # Running it every time is self-correcting regardless of what broke a
      # prior deploy. This is only cheap enough to do unconditionally because
      # of two things below: --programme-only avoids re-deriving chunks.jsonl
      # from the full (potentially catalog-sized) data/processed/ - a bare
      # `chunk.py` doing that previously OOM-killed this step on the VM - and
      # embed.py skips the OpenAI call entirely for any chunk whose text is
      # unchanged, so a no-op run costs nothing beyond a quick file diff.
      - name: Re-embed programme docs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/nusmods-rag
            docker compose exec -T backend python src/pipeline/chunk.py --programme-only
            docker compose exec -T backend python src/pipeline/embed.py
